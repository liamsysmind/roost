<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>roost — sign in</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #0c0c0c; color: #e6e6e6;
      display: grid; place-items: center; min-height: 100vh; margin: 0;
    }
    form {
      background: #181818; padding: 1.75rem 2rem; border-radius: 10px;
      min-width: 300px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border: 1px solid #262626;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.4rem; font-weight: 600; letter-spacing: 0.04em; }
    .sub { color: #888; font-size: 0.8rem; margin-bottom: 1.25rem; }
    label { display: block; margin: 1rem 0 0.35rem; font-size: 0.8rem; color: #aaa; }
    input {
      width: 100%; padding: 0.55rem 0.7rem; background: #0c0c0c; color: #e6e6e6;
      border: 1px solid #2a2a2a; border-radius: 6px; box-sizing: border-box;
      font-size: 0.95rem;
    }
    input:focus { outline: 1px solid #5b8; border-color: #5b8; }
    input[readonly] { color: #888; background: #1a1a1a; cursor: default; }
    input[readonly]:focus { outline: none; border-color: #2a2a2a; }
    button {
      width: 100%; margin-top: 1.25rem; padding: 0.6rem; background: #4caf80;
      color: #0a0a0a; border: none; border-radius: 6px; font-weight: 700;
      cursor: pointer; font-size: 0.95rem;
    }
    button:hover { background: #5cbf90; }
    .err { margin-top: 0.6rem; color: #ef6c6c; font-size: 0.8rem; min-height: 1em; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>roost <span id="roost-version" title="roost version" style="color:#7a8a8a;font-family:ui-monospace,monospace;font-size:0.7rem;font-weight:400;letter-spacing:0;margin-left:0.3rem">{{VERSION}}</span></h1>
    <div class="sub">a workspace your agents can return to</div>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="roost"
           autocomplete="username" readonly>
    <label for="password">Password</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
    <div class="err">{{ERROR}}</div>
  </form>
</body>
</html>
